<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>涓€鍗?路 缂?/title>
<style>
  :root{
    --ink:#0B0E1A; --ink2:#141828; --gold:#C9A227; --gold2:#E8D5A3;
    --paper:#F2EADA; --red:#8B2C2C; --line:rgba(232,213,163,.25);
    --n:#8a8a8a; --r:#5b8dd9; --sr:#c9a227; --ssr:#d94040;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--paper);
    font-family:"Songti SC","STSong","SimSun",serif;overflow:hidden}
  body{font-size:16px;line-height:1.6}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ===== 鑳屾櫙灞?===== */
  .bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
    opacity:.5;filter:saturate(.9);animation:bgDrift 30s ease-in-out infinite alternate}
  @keyframes bgDrift{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.1) translate(-1%,-1%)}}
  /* taste-skill-ignore: gradient (photo scrim over background) */
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,14,26,.3) 0%,rgba(11,14,26,.85) 70%,var(--ink) 100%)}

  /* ===== 灞忓箷瀹瑰櫒 ===== */
  .screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
    align-items:center;padding:24px;overflow-y:auto}
  .screen.active{display:flex}

  /* ===== 棣栧睆 ===== */
  #s-home{justify-content:center;text-align:center}
  #s-home h1{font-size:48px;letter-spacing:.4em;font-weight:400;margin-bottom:12px;font-family:serif}
  #s-home h1 span{color:var(--gold2)}
  #s-home .sub{font-size:14px;opacity:.7;letter-spacing:.3em;margin-bottom:80px}
  .btn-main{padding:16px 56px;border:1px solid var(--gold);color:var(--gold2);
    font-size:16px;letter-spacing:.4em;background:rgba(201,162,39,.08);transition:all .3s;
    border-radius:24px;cursor:pointer;position:relative;overflow:hidden}
  .btn-main:hover{background:rgba(201,162,39,.2);transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(201,162,39,.2)}
  .btn-main:active{background:rgba(201,162,39,.25);transform:translateY(0)}

  /* ===== 閫氱敤 ===== */
  .topbar{width:100%;max-width:420px;display:flex;justify-content:space-between;
    align-items:center;margin-bottom:20px;opacity:.85}
  .topbar .logo{font-size:16px;letter-spacing:.2em;color:var(--gold2);font-family:serif;font-weight:500}
  .topbar nav{display:flex;gap:20px;font-size:13px;opacity:.8}
  .topbar nav button{opacity:.7;transition:all .3s;position:relative;padding:4px 0;
    background:none;border:none;color:var(--ink3);font-size:13px;letter-spacing:.15em;cursor:pointer}
  .topbar nav button:hover{opacity:1;color:var(--gold2)}
  .topbar nav button::after{content:"";position:absolute;bottom:0;left:0;width:0;height:1px;
    background:var(--gold);transition:width .3s}
  .topbar nav button:hover::after{width:100%}
  .topbar nav button.active{opacity:1;color:var(--gold2)}

  h2{font-size:24px;font-weight:400;letter-spacing:.3em;text-align:center;margin-bottom:24px;font-family:serif;
    color:var(--gold2);text-shadow:0 2px 16px rgba(201,162,39,.2)}
  .group-label{font-size:13px;opacity:.6;margin:16px 0 8px;letter-spacing:.15em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{padding:8px 18px;border:1px solid var(--line);font-size:14px;letter-spacing:.1em;
    background:rgba(255,255,255,.03);transition:.2s}
  .chip:hover{border-color:var(--gold2);transform:translateY(-1px)}
  .chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,39,.12)}

  /* ===== 鎶藉崱椤?===== */
  .draw-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  .lottery{width:160px;height:220px;border:1px solid var(--gold);background:var(--ink2);
    display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.3em;
    color:var(--gold2);transition:all .4s;cursor:pointer;position:relative;overflow:hidden;
    background-image:url('assets/cardback-ssr.jpg');background-size:cover;background-position:center;
    border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
  .lottery::before{content:"鎶戒竴鏀?;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(11,14,26,.7);font-size:14px;letter-spacing:.3em;backdrop-filter:blur(2px);
    transition:background .3s}
  .lottery:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(201,162,39,.3)}
  .lottery:hover::before{background:rgba(11,14,26,.5)}
  .lottery:active{transform:scale(.96)}
  .lottery.shaking{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* 绮掑瓙鐗规晥 */
  .particle{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;
    animation:particleFly 1.2s ease-out forwards;box-shadow:0 0 6px currentColor}
  @keyframes particleFly{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
  }

  /* 鍗＄墝缈昏浆 */
  .card-flip{perspective:1200px;width:260px;height:360px}
  .card-inner{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
  .card-flip.flipped .card-inner{transform:rotateY(180deg)}
  .card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:8px;overflow:hidden;
    box-shadow:0 16px 48px rgba(0,0,0,.4)}
  .card-front{background:linear-gradient(135deg,var(--ink2),#1a1f35);display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:1px solid var(--gold)}
  .card-front::before{content:"缂?;font-size:64px;letter-spacing:.2em;color:var(--gold2);opacity:.2;font-family:serif}
  .card-front::after{content:"HALF 路 DESTINY";font-size:9px;letter-spacing:.3em;color:var(--gold2);opacity:.4;margin-top:20px}
  .card-back{background:var(--ink2);transform:rotateY(180deg)}

  /* 鍗＄墝 */
  .card{width:260px;height:360px;border:2px solid var(--line);background:var(--ink2);
    position:relative;overflow:hidden;transition:transform .5s;border-radius:4px}
  .card:hover{transform:translateY(-4px)}
  .card .photo{width:100%;height:75%;object-fit:cover}
  .card .info{padding:10px 12px;background:var(--ink2)}
  .card .name{font-size:16px;letter-spacing:.1em}
  .card .rarity{font-size:11px;letter-spacing:.2em;margin-top:4px}
  .rarity.n{color:var(--n)} .rarity.r{color:var(--r)}
  .rarity.sr{color:var(--sr)} .rarity.ssr{color:var(--ssr)}
  /* taste-skill-ignore: shadow (game rarity visual) */
  .frame-N{border-color:rgba(138,138,138,.4)}
  .frame-R{border-color:rgba(91,141,217,.6);box-shadow:0 0 16px rgba(91,141,217,.2)}
  .frame-SR{border-color:var(--sr);box-shadow:0 0 24px rgba(201,162,39,.3)}
  .frame-SSR{border-color:var(--ssr);box-shadow:0 0 40px rgba(217,64,64,.5);animation:ssrGlow 2s ease-in-out infinite}

  /* ===== 缁撴灉椤?===== */
  #s-result{justify-content:center;gap:20px;text-align:center}
  .verse{font-size:15px;opacity:.85;max-width:300px;letter-spacing:.12em;line-height:2.1;
    padding:20px 24px;border-left:2px solid var(--gold);text-align:left;font-family:serif;
    background:rgba(255,255,255,.03);border-radius:0 8px 8px 0;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:8px}
  .actions button{padding:12px;border:1px solid var(--line);font-size:14px;letter-spacing:.2em;
    transition:all .3s;background:transparent;border-radius:4px;cursor:pointer}
  .actions button:hover{border-color:var(--gold);background:rgba(201,162,39,.08);transform:translateY(-2px)}
  .actions button.primary{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,39,.1)}
  .actions button.primary:hover{background:rgba(201,162,39,.2);transform:translateY(-2px)}

  /* ===== 鍗″唽 ===== */
  .album{width:100%;max-width:420px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .album .item{aspect-ratio:3/4;border:1px solid var(--line);background:var(--ink2);
    display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.6;
    transition:all .3s;border-radius:6px;overflow:hidden;position:relative}
  .album .item:hover{transform:translateY(-4px) scale(1.02);opacity:.9}
  .album .item.owned{opacity:1;border-color:var(--gold)}
  .album .item.owned:hover{border-color:var(--gold2);box-shadow:0 8px 24px rgba(201,162,39,.2);transform:translateY(-4px) scale(1.02)}
  .album .item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .album .item:hover img{transform:scale(1.05)}

  /* ===== 灏忓 ===== */
  .home-card{width:200px;height:280px;border:2px solid var(--gold);background:var(--ink2);overflow:hidden;margin-bottom:16px;
    box-shadow:0 8px 32px rgba(201,162,39,.2);transition:all .4s;border-radius:8px}
  .home-card:hover{transform:translateY(-4px);box-shadow:0 16px 48px rgba(201,162,39,.3)}
  .home-card img{width:100%;height:75%;object-fit:cover;transition:transform .4s}
  .home-card:hover img{transform:scale(1.05)}
  .home-card .nm{padding:8px;text-align:center;font-size:14px;letter-spacing:.1em}
  .home-scene{width:280px;height:160px;border-radius:8px;overflow:hidden;margin:12px 0;
    border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.2);transition:all .5s;
    position:relative}
  .home-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,14,26,.3),transparent);pointer-events:none}
  .home-scene img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .home-scene:hover img{transform:scale(1.05)}
  .home-scene-label{font-size:11px;opacity:.5;letter-spacing:.15em;margin-bottom:4px}
  .bond{width:100%;max-width:300px;margin:12px 0}
  .bond .bar{height:8px;background:rgba(255,255,255,.1);margin-top:6px;position:relative;border-radius:4px;overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
  .bond .bar i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
    transition:width .6s;box-shadow:0 0 8px rgba(201,162,39,.4)}
  .stage-label{font-size:13px;opacity:.85;letter-spacing:.2em;padding:6px 20px;
    border:1px solid var(--gold);border-radius:20px;background:rgba(201,162,39,.1);color:var(--gold2);
    font-family:serif;box-shadow:0 2px 8px rgba(201,162,39,.15)}
  .act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:360px;margin:16px 0}
  .act-grid button{padding:14px 6px;border:1px solid var(--line);font-size:12px;letter-spacing:.1em;line-height:1.5;
    transition:all .3s;background:rgba(255,255,255,.03);border-radius:6px;cursor:pointer;font-family:serif}
  .act-grid button:hover{border-color:var(--gold);background:rgba(201,162,39,.1);transform:translateY(-2px);
    box-shadow:0 4px 12px rgba(201,162,39,.15)}
  .act-grid button:active{transform:translateY(0);background:rgba(201,162,39,.15)}
  .act-grid button:disabled{opacity:.3;transform:none;cursor:not-allowed}
  .dialog{max-width:360px;font-size:14px;opacity:.85;line-height:2;min-height:60px;text-align:center;
    padding:18px 24px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid var(--line);
    font-family:serif;letter-spacing:.05em;box-shadow:0 4px 16px rgba(0,0,0,.15)}
  .acts-left{font-size:12px;opacity:.5;margin-top:8px;padding:4px 12px;background:rgba(255,255,255,.03);border-radius:12px}

  /* 姣忔棩绛?*/
  .daily{font-size:16px;max-width:280px;text-align:center;line-height:2.2;letter-spacing:.1em;
    padding:32px 24px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;
    font-family:serif;box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative}
  .daily::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:40px;height:1px;background:var(--gold);opacity:.5}
  .daily .lucky{font-size:13px;color:var(--gold2);margin-top:16px;letter-spacing:.2em}

  /* 椤佃剼 */
  .footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;
    font-size:10px;opacity:.35;letter-spacing:.1em;z-index:2}
  .footer a{color:var(--gold2);text-decoration:none;opacity:.7}

  /* 鍔ㄧ敾 */
  .fade-in{animation:fadeIn .6s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .flip{animation:flipIn .8s ease}
  @keyframes flipIn{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}

  /* 浜插瘑搴﹁繘搴︽潯鍔ㄧ敾 */
  .bond .bar i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
    transition:width .6s ease;box-shadow:0 0 10px rgba(201,162,39,.5)}

  /* SSR 鍗＄墝鍙戝厜鍔ㄧ敾 */
  @keyframes ssrGlow{0%,100%{box-shadow:0 0 20px rgba(217,64,64,.3),0 0 40px rgba(217,64,64,.1)}50%{box-shadow:0 0 40px rgba(217,64,64,.6),0 0 80px rgba(217,64,64,.2)}}

  /* 鎸夐挳鐐瑰嚮娉㈢汗 */
  .btn-main{position:relative;overflow:hidden}
  .btn-main::after{content:"";position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;
    background:rgba(232,213,163,.3);transform:translate(-50%,-50%);transition:width .4s,height .4s}
  .btn-main:active::after{width:300px;height:300px}

  /* 棣栧睆鍏ュ満鍔ㄧ敾 */
  #s-home.active h1{animation:fadeIn .8s ease .2s both}
  #s-home.active .sub{animation:fadeIn .8s ease .4s both}
  #s-home.active .btn-main{animation:fadeIn .8s ease .6s both}

  /* 灞忓箷鍒囨崲鍔ㄧ敾 */
  .screen.active{animation:screenIn .4s ease}
  @keyframes screenIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  .screen.active h2{animation:fadeIn .5s ease both}
  .screen.active .group-label{animation:fadeIn .5s ease .1s both}
  .screen.active .chips{animation:fadeIn .5s ease .2s both}
  .screen.active .btn-main{animation:pop .5s ease .3s both}

  @media (max-width:380px){
    #s-home h1{font-size:36px}
    .card{width:220px;height:310px}
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<!-- ===== 棣栧睆 ===== -->
<section class="screen active" id="s-home">
  <h1>涓€鍗?span>路</span>缂?/h1>
  <div class="sub">濂界殑鍏崇郴锛屽悇鎾戜竴鍗?/div>
  <button class="btn-main" onclick="go('s-setup')">寮€濮?/button>
  <div style="margin-top:24px"><button onclick="openDaily()" style="font-size:12px;opacity:.6;letter-spacing:.2em">浠婃棩涓€绛?/button></div>
</section>

<!-- ===== 寤烘。 ===== -->
<section class="screen" id="s-setup">
  <div class="topbar"><div class="logo">涓€鍗?路 缂?/div><nav>
    <button onclick="go('s-home')">杩斿洖</button></nav></div>
  <h2>浣犳槸璋?/h2>
  <div class="group-label">鎬у埆</div>
  <div class="chips" id="c-sex"></div>
  <div class="group-label">骞撮緞娈?/div>
  <div class="chips" id="c-age"></div>
  <div class="group-label">姘旇川鍋忓ソ</div>
  <div class="chips" id="c-style"></div>
  <div style="margin-top:32px"></div>
  <button class="btn-main" onclick="setup()">绛句笅鍚嶅瓧</button>
</section>

<!-- ===== 鎶藉崱 ===== -->
<section class="screen" id="s-draw">
  <div class="topbar"><div class="logo">涓€鍗?路 缂?/div><nav>
    <button onclick="go('s-album')">鍗″唽</button>
    <button onclick="go('s-home2')">灏忓</button></nav></div>
  <div class="draw-stage">
    <div class="stage-label" id="draw-counts">浠婃棩浣?3 绛?/div>
    <div class="lottery" id="lottery" onclick="draw()">鎶戒竴鏀?/div>
    <div style="font-size:12px;opacity:.5">鎶藉崱鍗崇粨缂橈紝姣忔棩鍏嶈垂 3 娆?/div>
  </div>
</section>

<!-- ===== 缁撴灉 ===== -->
<section class="screen" id="s-result">
  <div class="card-flip" id="result-flip">
    <div class="card-inner">
      <div class="card-front">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--gold2);opacity:.3">缂?/div>
      </div>
      <div class="card-back" id="result-card"></div>
    </div>
  </div>
  <div class="verse" id="result-verse"></div>
  <div class="actions">
    <button onclick="draw()">鍐嶆娊涓€鏀?/button>
    <button class="primary" onclick="bringHome()">甯?TA 鍥炲</button>
    <button onclick="go('s-draw')">鍥炲埌绛剧瓛</button>
  </div>
</section>

<!-- ===== 鍗″唽 ===== -->
<section class="screen" id="s-album">
  <div class="topbar"><div class="logo">鍗″唽</div><nav>
    <button onclick="go('s-draw')">鎶界</button></nav></div>
  <h2>缂樺垎鍐?/h2>
  <div style="font-size:12px;opacity:.5;margin-bottom:16px;letter-spacing:.1em">宸叉敹钘?<span id="album-count">0</span> 寮?/div>
  <div class="album" id="album" style="overflow-y:auto;max-height:calc(100vh - 160px)"></div>
</section>

<!-- ===== 灏忓 ===== -->
<section class="screen" id="s-home2">
  <div class="topbar"><div class="logo">灏忓</div><nav>
    <button onclick="go('s-draw')">鎶界</button></nav></div>
  <h2>涓や汉鍗虫垚瀹?/h2>
  <div id="home-empty" style="text-align:center;opacity:.7;padding:40px 0;flex-direction:column;align-items:center;gap:16px">
    <div style="font-size:15px;letter-spacing:.1em;line-height:2.2;font-family:serif">浣犺繕娌℃妸璋佸甫鍥炲<br><br>鎶戒竴鏀紭鍒嗙锛岄亣瑙?TA</div>
    <button class="btn-main" onclick="go('s-draw')">鍘绘娊涓€鏀?/button>
  </div>
  <div id="home-full" style="display:none;flex-direction:column;align-items:center;gap:8px;width:100%">
    <div class="home-card"><img id="home-photo"><div class="nm" id="home-name"></div></div>
    <div class="stage-label" id="home-stage">鍒濋亣</div>
    <div class="bond">
      <div style="display:flex;justify-content:space-between;font-size:12px;opacity:.7">
        <span>浜插瘑搴?/span><span id="bond-num">0</span></div>
      <div class="bar"><i id="bond-fill" style="width:0%"></i></div>
    </div>
    <div class="home-scene-label">灏忓涓€瑙?/div>
    <div class="home-scene"><img id="home-scene-img" src="assets/home-living.png"></div>
    <div class="act-grid">
      <button onclick="act('say')">濂藉ソ璇磋瘽</button>
      <button onclick="act('live')">鎱㈡參杩囨棩瀛?/button>
      <button onclick="act('half')">鍚勬拺涓€鍗?/button>
    </div>
    <div class="acts-left" id="acts-left"></div>
    <div class="dialog" id="dialog"></div>
    <button onclick="shareCard()" style="margin-top:12px;font-size:12px;opacity:.7;letter-spacing:.2em;padding:8px 24px;border:1px solid var(--line);border-radius:20px;transition:all .3s;background:rgba(255,255,255,.03);font-family:serif">鐢熸垚鍒嗕韩鍗?/button>
  </div>
</section>

<!-- 姣忔棩绛炬诞灞?-->
<section class="screen" id="s-daily">
  <div class="topbar"><div class="logo">浠婃棩涓€绛?/div><nav>

  let roll=Math.random()*total,rarity="N";

  if(rarity==="SR"||rarity==="SSR") S.pity=0; else S.pity=pity;

      </div>
      <div style="font-size:24px;letter-spacing:.2em;margin-bottom:8px">${prev} 鈫?${cur}</div>
      <div style="font-size:13px;opacity:.6;margin-bottom:24px;line-height:1.8">${cur==="鐩稿畧"?"浣犱滑宸茬粡璧拌繃浜嗗垵閬囥€佺浉鐔熴€佺浉鐭ャ€?:"缁х画鐩稿锛屼翰瀵嗗害浼氬啀娑ㄣ€?}</div>
      <button onclick="this.closest('div[style*=fixed]').remove()" style="padding:10px 40px;border:1px solid var(--gold);color:var(--gold2);font-size:14px;letter-spacing:.2em;background:rgba(201,162,39,.1);border-radius:20px;transition:all .3s">缁х画</button>
    </div>`;
  overlay.onclick=()=>overlay.remove();
  document.body.appendChild(overlay);
}

/* ============ 娓叉煋 ============ */
function render(){
  const tk=todayKey();
  const d=(S.days||{})[tk]||{draws:0};
  const left=Math.max(0,3-d.draws);
  const dc=document.getElementById("draw-counts");
  if(dc) dc.textContent="浠婃棩浣?"+left+" 绛?;

  const ab=document.getElementById("album");
  if(ab){
    ab.innerHTML="";
    const all=Object.values(S.album||{});
    const countEl=document.getElementById("album-count");
    if(countEl) countEl.textContent=all.length;
    if(all.length===0){
      ab.innerHTML='<div style="grid-column:1/-1;text-align:center;opacity:.5;padding:40px 0;font-size:13px;letter-spacing:.1em">杩樻病鏈夋敹钘?br><br>鍘绘娊涓€鏀惂</div>';
    } else {
      all.forEach(c=>{
        const div=document.createElement("div");
        div.className="item owned";
        div.innerHTML=`<img src="${c.url}" onerror="this.style.display='none'">`;
        ab.appendChild(div);
      });
    }
  }
  renderHome();
}

/* 鍚姩 */
document.getElementById("bg").style.backgroundImage="url('assets/bg-night-new.png')";
buildChips();
render();
</script>
