<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>一半 · 缘</title>
<style>
  :root{
    --ink:#0B0E1A; --ink2:#141828; --gold:#C9A227; --gold2:#E8D5A3;
    --paper:#F2EADA; --red:#8B2C2C; --line:rgba(232,213,163,.25);
    --n:#8a8a8a; --r:#5b8dd9; --sr:#c9a227; --ssr:#d94040;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--ink);color:var(--paper);
    font-family:"Songti SC","STSong","SimSun",serif;overflow:hidden}
  body{font-size:16px;line-height:1.6}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

  /* ===== 背景层 ===== */
  .bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;
    opacity:.5;filter:saturate(.9);animation:bgDrift 30s ease-in-out infinite alternate}
  @keyframes bgDrift{from{transform:scale(1.05) translate(0,0)}to{transform:scale(1.1) translate(-1%,-1%)}}
  /* taste-skill-ignore: gradient (photo scrim over background) */
  .bg::after{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(11,14,26,.3) 0%,rgba(11,14,26,.85) 70%,var(--ink) 100%)}

  /* ===== 屏幕容器 ===== */
  .screen{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;
    align-items:center;padding:24px;overflow-y:auto}
  .screen.active{display:flex}

  /* ===== 首屏 ===== */
  #s-home{justify-content:center;text-align:center}
  #s-home h1{font-size:48px;letter-spacing:.4em;font-weight:400;margin-bottom:12px;font-family:serif}
  #s-home h1 span{color:var(--gold2)}
  #s-home .sub{font-size:14px;opacity:.7;letter-spacing:.3em;margin-bottom:80px}
  .btn-main{padding:16px 56px;border:1px solid var(--gold);color:var(--gold2);
    font-size:16px;letter-spacing:.4em;background:rgba(201,162,39,.08);transition:.3s}
  .btn-main:hover{background:rgba(201,162,39,.2);transform:translateY(-2px)}
  .btn-main:active{background:rgba(201,162,39,.25);transform:translateY(0)}

  /* ===== 通用 ===== */
  .topbar{width:100%;max-width:420px;display:flex;justify-content:space-between;
    align-items:center;margin-bottom:20px;opacity:.8}
  .topbar .logo{font-size:14px;letter-spacing:.2em;color:var(--gold2)}
  .topbar nav{display:flex;gap:16px;font-size:13px;opacity:.8}
  .topbar nav button{opacity:.7;transition:opacity .2s}
  .topbar nav button:hover{opacity:1}
  .topbar nav button.active{opacity:1;color:var(--gold2)}

  h2{font-size:22px;font-weight:400;letter-spacing:.2em;text-align:center;margin-bottom:24px;font-family:serif}
  .group-label{font-size:13px;opacity:.6;margin:16px 0 8px;letter-spacing:.15em}
  .chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .chip{padding:8px 18px;border:1px solid var(--line);font-size:14px;letter-spacing:.1em;
    background:rgba(255,255,255,.03);transition:.2s}
  .chip:hover{border-color:var(--gold2);transform:translateY(-1px)}
  .chip.on{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,39,.12)}

  /* ===== 抽卡页 ===== */
  .draw-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
  .lottery{width:160px;height:220px;border:1px solid var(--gold);background:var(--ink2);
    display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.3em;
    color:var(--gold2);transition:all .4s;cursor:pointer;position:relative;overflow:hidden;
    background-image:url('assets/cardback-ssr.jpg');background-size:cover;background-position:center;
    border-radius:4px;box-shadow:0 4px 24px rgba(0,0,0,.3)}
  .lottery::before{content:"抽一支";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(11,14,26,.7);font-size:14px;letter-spacing:.3em;backdrop-filter:blur(2px);
    transition:background .3s}
  .lottery:hover{transform:translateY(-4px);box-shadow:0 8px 32px rgba(201,162,39,.3)}
  .lottery:hover::before{background:rgba(11,14,26,.5)}
  .lottery:active{transform:scale(.96)}
  .lottery.shaking{animation:shake .5s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* 粒子特效 */
  .particle{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;
    animation:particleFly 1.2s ease-out forwards;box-shadow:0 0 6px currentColor}
  @keyframes particleFly{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
  }

  /* 卡牌翻转 */
  .card-flip{perspective:1200px;width:260px;height:360px}
  .card-inner{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
  .card-flip.flipped .card-inner{transform:rotateY(180deg)}
  .card-front,.card-back{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:4px;overflow:hidden}
  .card-front{background:linear-gradient(135deg,var(--ink2),#1a1f35);display:flex;flex-direction:column;align-items:center;justify-content:center;
    box-shadow:0 8px 32px rgba(0,0,0,.3)}
  .card-front::before{content:"缘";font-size:64px;letter-spacing:.2em;color:var(--gold2);opacity:.2;font-family:serif}
  .card-front::after{content:"HALF · DESTINY";font-size:9px;letter-spacing:.3em;color:var(--gold2);opacity:.4;margin-top:20px}
  .card-back{background:var(--ink2);transform:rotateY(180deg)}

  /* 卡牌 */
  .card{width:260px;height:360px;border:2px solid var(--line);background:var(--ink2);
    position:relative;overflow:hidden;transition:transform .5s;border-radius:4px}
  .card:hover{transform:translateY(-4px)}
  .card .photo{width:100%;height:75%;object-fit:cover}
  .card .info{padding:10px 12px;background:var(--ink2)}
  .card .name{font-size:16px;letter-spacing:.1em}
  .card .rarity{font-size:11px;letter-spacing:.2em;margin-top:4px}
  .rarity.n{color:var(--n)} .rarity.r{color:var(--r)}
  .rarity.sr{color:var(--sr)} .rarity.ssr{color:var(--ssr)}
  /* taste-skill-ignore: shadow (game rarity visual) */
  .frame-N{border-color:rgba(138,138,138,.4)}
  .frame-R{border-color:rgba(91,141,217,.6);box-shadow:0 0 12px rgba(91,141,217,.15)}
  .frame-SR{border-color:var(--sr);box-shadow:0 0 20px rgba(201,162,39,.25)}
  .frame-SSR{border-color:var(--ssr);box-shadow:0 0 30px rgba(217,64,64,.4);animation:ssrGlow 2s ease-in-out infinite}

  /* ===== 结果页 ===== */
  #s-result{justify-content:center;gap:20px;text-align:center}
  .verse{font-size:14px;opacity:.8;max-width:300px;letter-spacing:.1em;line-height:1.9;
    padding:16px 20px;border-left:2px solid var(--gold);text-align:left;font-family:serif;
    background:rgba(255,255,255,.02);border-radius:0 8px 8px 0}
  .actions{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px;margin-top:8px}
  .actions button{padding:12px;border:1px solid var(--line);font-size:14px;letter-spacing:.2em;
    transition:all .3s;background:transparent;border-radius:4px;cursor:pointer}
  .actions button:hover{border-color:var(--gold);background:rgba(201,162,39,.08);transform:translateY(-2px)}
  .actions button.primary{border-color:var(--gold);color:var(--gold2);background:rgba(201,162,39,.1)}
  .actions button.primary:hover{background:rgba(201,162,39,.2);transform:translateY(-2px)}

  /* ===== 卡册 ===== */
  .album{width:100%;max-width:420px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .album .item{aspect-ratio:3/4;border:1px solid var(--line);background:var(--ink2);
    display:flex;align-items:center;justify-content:center;font-size:12px;opacity:.6;
    transition:all .3s;border-radius:4px;overflow:hidden;position:relative}
  .album .item:hover{transform:translateY(-4px) scale(1.02);opacity:.9}
  .album .item.owned{opacity:1;border-color:var(--gold)}
  .album .item.owned:hover{border-color:var(--gold2);box-shadow:0 4px 20px rgba(201,162,39,.2)}
  .album .item img{width:100%;height:100%;object-fit:cover;transition:transform .3s}
  .album .item:hover img{transform:scale(1.05)}

  /* ===== 小家 ===== */
  .home-card{width:200px;height:280px;border:2px solid var(--gold);background:var(--ink2);overflow:hidden;margin-bottom:16px;
    box-shadow:0 8px 32px rgba(201,162,39,.2);transition:all .4s;border-radius:4px}
  .home-card:hover{transform:translateY(-4px);box-shadow:0 12px 40px rgba(201,162,39,.3)}
  .home-card img{width:100%;height:75%;object-fit:cover;transition:transform .4s}
  .home-card:hover img{transform:scale(1.05)}
  .home-card .nm{padding:8px;text-align:center;font-size:14px;letter-spacing:.1em}
  .home-scene{width:280px;height:160px;border-radius:8px;overflow:hidden;margin:12px 0;
    border:1px solid var(--line);box-shadow:0 4px 16px rgba(0,0,0,.2);transition:all .5s;
    position:relative}
  .home-scene::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(11,14,26,.3),transparent);pointer-events:none}
  .home-scene img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
  .home-scene:hover img{transform:scale(1.05)}
  .home-scene-label{font-size:11px;opacity:.5;letter-spacing:.15em;margin-bottom:4px}
  .bond{width:100%;max-width:300px;margin:12px 0}
  .bond .bar{height:6px;background:rgba(255,255,255,.1);margin-top:4px;position:relative;border-radius:3px;overflow:hidden}
  .bond .bar i{position:absolute;left:0;top:0;height:100%;background:var(--gold);transition:width .6s}
  .stage-label{font-size:13px;opacity:.7;letter-spacing:.15em;padding:4px 16px;
    border:1px solid var(--line);border-radius:20px;background:rgba(201,162,39,.05)}
  .act-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:360px;margin:16px 0}
  .act-grid button{padding:12px 6px;border:1px solid var(--line);font-size:12px;letter-spacing:.08em;line-height:1.5;
    transition:all .3s;background:rgba(255,255,255,.02);border-radius:4px;cursor:pointer}
  .act-grid button:hover{border-color:var(--gold);background:rgba(201,162,39,.08);transform:translateY(-2px)}
  .act-grid button:active{transform:translateY(0);background:rgba(201,162,39,.15)}
  .act-grid button:disabled{opacity:.3;transform:none;cursor:not-allowed}
  .dialog{max-width:360px;font-size:14px;opacity:.85;line-height:1.9;min-height:60px;text-align:center;
    padding:16px 20px;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid var(--line);
    font-family:serif;letter-spacing:.05em}
  .acts-left{font-size:12px;opacity:.5;margin-top:8px;padding:4px 12px;background:rgba(255,255,255,.03);border-radius:12px}

  /* 每日签 */
  .daily{font-size:16px;max-width:280px;text-align:center;line-height:2.2;letter-spacing:.1em;
    padding:32px 24px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:8px;
    font-family:serif;box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative}
  .daily::before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
    width:40px;height:1px;background:var(--gold);opacity:.5}
  .daily .lucky{font-size:13px;color:var(--gold2);margin-top:16px;letter-spacing:.2em}

  /* 页脚 */
  .footer{position:fixed;bottom:8px;left:0;right:0;text-align:center;
    font-size:10px;opacity:.35;letter-spacing:.1em;z-index:2}
  .footer a{color:var(--gold2);text-decoration:none;opacity:.7}

  /* 动画 */
  .fade-in{animation:fadeIn .6s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
  .flip{animation:flipIn .8s ease}
  @keyframes flipIn{0%{transform:rotateY(90deg);opacity:0}100%{transform:rotateY(0);opacity:1}}

  /* 亲密度进度条动画 */
  .bond .bar i{position:absolute;left:0;top:0;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));
    transition:width .6s ease;box-shadow:0 0 10px rgba(201,162,39,.5)}

  /* SSR 卡牌发光动画 */
  @keyframes ssrGlow{0%,100%{box-shadow:0 0 20px rgba(217,64,64,.3)}50%{box-shadow:0 0 40px rgba(217,64,64,.6)}}

  /* 按钮点击波纹 */
  .btn-main{position:relative;overflow:hidden}
  .btn-main::after{content:"";position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;
    background:rgba(232,213,163,.3);transform:translate(-50%,-50%);transition:width .4s,height .4s}
  .btn-main:active::after{width:300px;height:300px}

  /* 首屏入场动画 */
  #s-home.active h1{animation:fadeIn .8s ease .2s both}
  #s-home.active .sub{animation:fadeIn .8s ease .4s both}
  #s-home.active .btn-main{animation:fadeIn .8s ease .6s both}

  /* 屏幕切换动画 */
  .screen.active{animation:screenIn .4s ease}
  @keyframes screenIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
  .screen.active h2{animation:fadeIn .5s ease both}
  .screen.active .group-label{animation:fadeIn .5s ease .1s both}
  .screen.active .chips{animation:fadeIn .5s ease .2s both}
  .screen.active .btn-main{animation:pop .5s ease .3s both}

  @media (max-width:380px){
    #s-home h1{font-size:36px}
    .card{width:220px;height:310px}
  }
</style>
</head>
<body>
<div class="bg" id="bg"></div>

<!-- ===== 首屏 ===== -->
<section class="screen active" id="s-home">
  <h1>一半<span>·</span>缘</h1>
  <div class="sub">好的关系，各撑一半</div>
  <button class="btn-main" onclick="go('s-setup')">开始</button>
  <div style="margin-top:24px"><button onclick="openDaily()" style="font-size:12px;opacity:.6;letter-spacing:.2em">今日一签</button></div>
</section>

<!-- ===== 建档 ===== -->
<section class="screen" id="s-setup">
  <div class="topbar"><div class="logo">一半 · 缘</div><nav>
    <button onclick="go('s-home')">返回</button></nav></div>
  <h2>你是谁</h2>
  <div class="group-label">性别</div>
  <div class="chips" id="c-sex"></div>
  <div class="group-label">年龄段</div>
  <div class="chips" id="c-age"></div>
  <div class="group-label">气质偏好</div>
  <div class="chips" id="c-style"></div>
  <div style="margin-top:32px"></div>
  <button class="btn-main" onclick="setup()">签下名字</button>
</section>

<!-- ===== 抽卡 ===== -->
<section class="screen" id="s-draw">
  <div class="topbar"><div class="logo">一半 · 缘</div><nav>
    <button onclick="go('s-album')">卡册</button>
    <button onclick="go('s-home2')">小家</button></nav></div>
  <div class="draw-stage">
    <div class="stage-label" id="draw-counts">今日余 3 签</div>
    <div class="lottery" id="lottery" onclick="draw()">抽一支</div>
    <div style="font-size:12px;opacity:.5">抽卡即结缘，每日免费 3 次</div>
  </div>
</section>

<!-- ===== 结果 ===== -->
<section class="screen" id="s-result">
  <div class="card-flip" id="result-flip">
    <div class="card-inner">
      <div class="card-front">
        <div style="flex:1;display:flex;align-items:center;justify-content:center;color:var(--gold2);opacity:.3">缘</div>
      </div>
      <div class="card-back" id="result-card"></div>
    </div>
  </div>
  <div class="verse" id="result-verse"></div>
  <div class="actions">
    <button onclick="draw()">再抽一支</button>
    <button class="primary" onclick="bringHome()">带 TA 回家</button>
    <button onclick="go('s-draw')">回到签筒</button>
  </div>
</section>

<!-- ===== 卡册 ===== -->
<section class="screen" id="s-album">
  <div class="topbar"><div class="logo">卡册</div><nav>
    <button onclick="go('s-draw')">抽签</button></nav></div>
  <h2>缘分册</h2>
  <div style="font-size:12px;opacity:.5;margin-bottom:16px;letter-spacing:.1em">已收藏 <span id="album-count">0</span> 张</div>
  <div class="album" id="album" style="overflow-y:auto;max-height:calc(100vh - 160px)"></div>
</section>

<!-- ===== 小家 ===== -->
<section class="screen" id="s-home2">
  <div class="topbar"><div class="logo">小家</div><nav>
    <button onclick="go('s-draw')">抽签</button></nav></div>
  <h2>两人即成家</h2>
  <div id="home-empty" style="text-align:center;opacity:.7;padding:40px 0;flex-direction:column;align-items:center;gap:16px">
    <div style="font-size:14px;letter-spacing:.1em;line-height:2">你还没把谁带回家<br><br>抽一支缘分签，遇见 TA</div>
    <button class="btn-main" onclick="go('s-draw')">去抽一支</button>
  </div>
  <div id="home-full" style="display:none;flex-direction:column;align-items:center;gap:8px;width:100%">
    <div class="home-card"><img id="home-photo"><div class="nm" id="home-name"></div></div>
    <div class="stage-label" id="home-stage">初遇</div>
    <div class="bond">
      <div style="display:flex;justify-content:space-between;font-size:12px;opacity:.7">
        <span>亲密度</span><span id="bond-num">0</span></div>
      <div class="bar"><i id="bond-fill" style="width:0%"></i></div>
    </div>
    <div class="home-scene-label">小家一角</div>
    <div class="home-scene"><img id="home-scene-img" src="assets/home-living.png"></div>
    <div class="act-grid">
      <button onclick="act('say')">好好说话</button>
      <button onclick="act('live')">慢慢过日子</button>
      <button onclick="act('half')">各撑一半</button>
    </div>
    <div class="acts-left" id="acts-left"></div>
    <div class="dialog" id="dialog"></div>
    <button onclick="shareCard()" style="margin-top:12px;font-size:12px;opacity:.6;letter-spacing:.2em;padding:8px 24px;border:1px solid var(--line);border-radius:20px;transition:all .3s">生成分享卡</button>
  </div>
</section>

<!-- 每日签浮层 -->
<section class="screen" id="s-daily">
  <div class="topbar"><div class="logo">今日一签</div><nav>
    <button onclick="go('s-home')">关闭</button></nav></div>
  <div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;width:100%">
    <div style="font-size:12px;letter-spacing:.3em;opacity:.5">今日运势</div>
    <div class="daily" id="daily-text"></div>
    <div class="lucky" id="daily-bonus"></div>
  </div>
</section>

<div class="footer">人物均为 AI 生成 · 内容仅供娱乐参考</div>

<script>
/* ============ 数据 ============ */
const BASE="https://cdn.jsdelivr.net/gh/mengxxx111/yiban-assets@main";
const AGES=["20s","25s","30s","35s","40s"];
const STYLES={
  "光系":{en:"sunny",desc:"明亮"},
  "暖系":{en:"warm",desc:"温柔"},
  "澈系":{en:"cool",desc:"清冷"},
  "安系":{en:"distant",desc:"沉稳"}
};
const RARITY=[
  {k:"N",w:55,color:"var(--n)"},
  {k:"R",w:30,color:"var(--r)"},
  {k:"SR",w:12,color:"var(--sr)"},
  {k:"SSR",w:3,color:"var(--ssr)"}
];
const NAMES=["昭","昀","晗","曦","晴","晏","晗","栩","慕","慕","辞","念","安","寻","遇","笙","晚","星","河","川"];
const VERSES={
  "光系":["你是照亮屋檐的那束光","晴天里的光，落在你肩上","遇见你的那天，云都亮了","你像清晨的第一缕阳光，温柔却有力量","有你的地方，就是晴天","阳光刚好落在你发梢"],
  "暖系":["你是冬日窗台上的一盏灯","温柔的人，慢慢走近","烟火气里，最暖是你","你笑起来的样子，像冬天里的热可可","和你在一起，连空气都是暖的","你是我疲惫生活里的温柔梦想"],
  "澈系":["你是雪后初晴的那面湖","清冷的外表，藏着温柔","初见时，你像一场初雪","你像秋天的湖水，安静又深邃","你的眼睛里，有星星也有湖水","清冷的气质，温柔的心"],
  "安系":["你是深夜归家时留的那盏灯","沉稳的人，最心安","岁月漫长，你在就好","和你在一起，时间都慢了","你是我安稳岁月里的小确幸","有你在，哪里都是家"]
};
const STAGES=[{n:"初遇",min:0},{n:"相熟",min:30},{n:"相知",min:60},{n:"相守",min:100}];
const ACT_LINES={
  say:["你说：今天有点累。我说：那我把饭做好。","你说：刚才那句话重了。我说：我知道。","你说：想你了。我说：我也想你。","你说：我是不是很麻烦？我说：你是我的小麻烦。","你说：今天好难过。我说：抱抱，我在。","你说：谢谢你。我说：跟我还客气什么。"],
  live:["我们一起擦了窗户","晚饭是你做的，我洗的碗","饭后散步，走了很远","周末一起整理了书架","你浇花，我拖地","我们一起看了一部老电影"],
  half:["你撑着伞，我提着菜","你说你忙，我说我来","我们各让一步，刚好","你加班，我留灯","你早起，我做早餐","你难的时候，我顶上去"]
};

/* ============ 状态 ============ */
let S=load();
function load(){
  try{return JSON.parse(localStorage.getItem("yiban-game")||"{}")}catch(e){return{}}
}
function save(){localStorage.setItem("yiban-game",JSON.stringify(S))}

/* ============ 工具 ============ */
function go(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  // 不同页面配不同背景
  const bg=document.getElementById("bg");
  if(id==="s-home2"){
    bg.style.backgroundImage="url('assets/bg-dusk-new.png')";
  } else if(id==="s-daily"){
    bg.style.backgroundImage="url('assets/daily-sign-bg.png')";
  } else {
    bg.style.backgroundImage="url('assets/bg-night-new.png')";
  }
  render();
}
function todayKey(){return new Date().toISOString().slice(0,10)}
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function pick(arr){return arr[rnd(0,arr.length-1)]}

/* ============ 建档 ============ */
function buildChips(){
  const mk=(id,opts,onPick)=>{
    const el=document.getElementById(id);
    el.innerHTML="";
    opts.forEach(o=>{
      const b=document.createElement("button");
      b.className="chip"+((S.setup||{})[id]===o?" on":"");
      b.textContent=o;
      b.onclick=()=>{
        S.setup=S.setup||{};S.setup[id]=o;save();buildChips();
      };
      el.appendChild(b);
    });
  };
  mk("c-sex",["男","女"]);
  mk("c-age",AGES.map(a=>a.replace("s","代")));
  mk("c-style",Object.keys(STYLES));
}
function setup(){
  if(!S.setup||!S.setup["c-sex"]||!S.setup["c-age"]||!S.setup["c-style"]){
    alert("三项都选一下");return
  }
  S.played=true;save();
  go("s-draw");
}

/* ============ 抽卡 ============ */
function draw(){
  const tk=todayKey();
  S.days=S.days||{};
  const d=S.days[tk]||{draws:0,acts:3,signed:false};
  if(d.draws>=3 && !d.bonus){alert("今日免费 3 抽已用完，明天再来");return}
  if(d.bonus>0){d.bonus--}else{d.draws++}
  S.days[tk]=d;save();

  // 粒子特效
  const lottery=document.getElementById("lottery");
  const colors=["#C9A227","#E8D5A3","#F2EADA","#D94040","#5B8DD9"];
  for(let i=0;i<20;i++){
    const p=document.createElement("div");
    p.className="particle";
    p.style.left="50%";p.style.top="50%";
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.color=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=Math.random()*4+2+"px";
    p.style.height=p.style.width;
    p.style.setProperty("--dx",(Math.random()-0.5)*300+"px");
    p.style.setProperty("--dy",(Math.random()-0.5)*300+"px");
    lottery.appendChild(p);
    setTimeout(()=>p.remove(),1200);
  }

  // 稀有度
  const pity=(S.pity||0)+1;
  let pool=RARITY.map(r=>({...r,n:r.w}));
  if(pity>=50) pool=RARITY.map(r=>({...r,n:r.k==="SSR"?100:0}));
  else if(pity>=10) pool=RARITY.map(r=>({...r,n:r.k==="SR"||r.k==="SSR"?60:0}));
  const total=pool.reduce((s,r)=>s+r.n,0);
  let roll=Math.random()*total,rarity="N";
  for(const p of pool){if(roll<p.n){rarity=p.k;break}roll-=p.n}
  if(rarity==="SR"||rarity==="SSR") S.pity=0; else S.pity=pity;

  // 图
  const gender=S.setup["c-sex"]==="男"?"female":"male";
  const styleCN=S.setup["c-style"];
  const age=AGES[AGES.indexOf(S.setup["c-age"].replace("代","s"))];
  const style=STYLES[styleCN];
  const n=rnd(1,60);
  const url=`${BASE}/${gender}/${age}/${encodeURIComponent(styleCN)}/${gender}-${age}-${style.en}-${String(n).padStart(3,"0")}.webp`;
  const id=`${gender}-${age}-${style.en}-${n}`;
  const card={id,url,rarity,style:styleCN,age:age,gender};

  // 卡册
  S.album=S.album||{};
  if(!S.album[id]) S.album[id]=card;

  // 结果
  const flip=document.getElementById("result-flip");
  flip.classList.remove("flipped");
  document.getElementById("result-card").className="card-back frame-"+rarity;
  document.getElementById("result-card").innerHTML=`
    <img class="photo" src="${url}" onerror="this.style.display='none'" style="width:100%;height:75%;object-fit:cover">
    <div class="info" style="padding:10px 12px;background:var(--ink2)">
      <div class="name">${pick(NAMES)} · ${styleCN}</div>
      <div class="rarity rarity-${rarity.toLowerCase()}">${rarity}</div>
    </div>`;
  document.getElementById("result-verse").textContent=pick(VERSES[styleCN]);

  go("s-result");
  setTimeout(()=>flip.classList.add("flipped"),300);
}

/* ============ 小家 ============ */
function bringHome(){
  if(!S.album) return;
  const last=Object.values(S.album).pop();
  S.home=last;save();
  go("s-home2");
}
function renderHome(){
  const full=document.getElementById("home-full");
  const empty=document.getElementById("home-empty");
  if(!S.home){empty.style.display="block";full.style.display="none";return}
  empty.style.display="none";full.style.display="flex";
  document.getElementById("home-photo").src=S.home.url;
  document.getElementById("home-name").textContent=S.home.style+" · "+S.home.rarity;
  const bond=S.bond||0;
  document.getElementById("bond-num").textContent=bond;
  document.getElementById("bond-fill").style.width=Math.min(100,bond)+"%";
  const st=STAGES.slice().reverse().find(s=>bond>=s.min);
  document.getElementById("home-stage").textContent=st?st.n:"初遇";
  // 根据阶段切换场景插画
  const sceneImg=document.getElementById("home-scene-img");
  if(st){
    if(st.n==="初遇") sceneImg.src="assets/home-living.png";
    else if(st.n==="相熟") sceneImg.src="assets/home-bedroom.png";
    else if(st.n==="相知") sceneImg.src="assets/home-balcony.png";
    else sceneImg.src="assets/home-living.png";
  }
  const tk=todayKey();
  const left=(S.days||{})[tk]?.acts??3;
  document.getElementById("acts-left").textContent="今日还可相处 "+left+" 次";
}
function act(type){
  const tk=todayKey();
  S.days=S.days||{};
  const d=S.days[tk]||{acts:3};
  if(d.acts<=0){alert("今日相处次数用完了，明天再来");return}
  d.acts--;
  S.days[tk]=d;
  S.bond=(S.bond||0)+rnd(8,12);
  save();
  checkStage();
  document.getElementById("dialog").textContent=pick(ACT_LINES[type]);
  renderHome();
}

/* ============ 每日签 ============ */
const DAILY_SIGNS=[
  "今天宜勇敢，想说的话别藏着","今天宜慢一点，别催对方","今天宜主动，一杯水也是关心","今天宜独处，留点空间给彼此",
  "今天宜说真话，哪怕有点疼","今天宜笑一笑，昨天的事就翻篇","今天宜牵手，走路时别玩手机","今天宜做饭，烟火气最养人",
  "今天宜拥抱，从背后抱一下也好","今天宜写信，哪怕只是一句话","今天宜散步，夕阳下的路很长","今天宜做饭，两个人一起吃才香",
  "今天宜道歉，低个头不丢人","今天宜夸夸对方，今天辛苦你了","今天宜发呆，什么都不做也很好","今天宜回忆，第一次见面的样子还记得吗"
];
function openDaily(){
  const tk=todayKey();
  S.days=S.days||{};
  const d=S.days[tk]||{};
  if(!d.signed){
    d.signed=true;d.bonus=(d.bonus||0)+1;
    S.days[tk]=d;save();
  }
  document.getElementById("daily-text").textContent=pick(DAILY_SIGNS);
  document.getElementById("daily-bonus").textContent=d.signed?"今日已签 · 送 1 次免费抽":"今日已签";
  go("s-daily");
}

/* ============ 分享卡 ============ */
function shareCard(){
  if(!S.home) return;
  const c=document.createElement("canvas");
  c.width=600;c.height=900;
  const ctx=c.getContext("2d");
  // 背景
  const grad=ctx.createLinearGradient(0,0,0,900);
  grad.addColorStop(0,"#0B0E1A");
  grad.addColorStop(1,"#1a1f35");
  ctx.fillStyle=grad;ctx.fillRect(0,0,600,900);
  // 边框
  ctx.strokeStyle="#C9A227";ctx.lineWidth=2;
  ctx.strokeRect(40,40,520,820);
  // 内边框
  ctx.strokeStyle="rgba(201,162,39,.3)";ctx.lineWidth=1;
  ctx.strokeRect(50,50,500,800);
  // 标题
  ctx.fillStyle="#E8D5A3";ctx.font="28px serif";ctx.textAlign="center";
  ctx.fillText("一半 · 缘",300,100);
  // 装饰线
  ctx.strokeStyle="rgba(201,162,39,.5)";ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(200,120);ctx.lineTo(400,120);ctx.stroke();
  // 副标题
  ctx.fillStyle="#F2EADA";ctx.font="20px serif";
  ctx.fillText("我把 TA 带回了家",300,160);
  ctx.font="16px serif";ctx.fillStyle="#999";
  ctx.fillText(S.home.style+" · "+S.home.rarity,300,200);
  // 阶段插画占位
  ctx.fillStyle="rgba(201,162,39,.1)";
  ctx.fillRect(150,240,300,200);
  ctx.strokeStyle="rgba(201,162,39,.3)";
  ctx.strokeRect(150,240,300,200);
  ctx.fillStyle="rgba(232,213,163,.5)";ctx.font="14px serif";
  ctx.fillText("两人的小家",300,350);
  // 亲密度进度条
  ctx.fillStyle="rgba(255,255,255,.1)";
  ctx.fillRect(150,500,300,6);
  const bond=S.bond||0;
  const bondGrad=ctx.createLinearGradient(150,0,450,0);
  bondGrad.addColorStop(0,"#C9A227");
  bondGrad.addColorStop(1,"#E8D5A3");
  ctx.fillStyle=bondGrad;
  ctx.fillRect(150,500,Math.min(300,bond*3),6);
  // 亲密度文字
  ctx.fillStyle="#C9A227";ctx.font="18px serif";
  ctx.fillText("亲密度 "+bond,300,540);
  // 阶段
  const st=STAGES.slice().reverse().find(s=>bond>=s.min);
  ctx.fillStyle="#999";ctx.font="14px serif";
  ctx.fillText(st?st.n:"初遇",300,570);
  // 底部
  ctx.fillStyle="#666";ctx.font="14px serif";
  ctx.fillText("来一半·缘，遇见你的另一半",300,830);
  // 下载
  const a=document.createElement("a");
  a.download="yiban-share.png";a.href=c.toDataURL("image/png");
  a.click();
}

/* ============ 阶段解锁弹窗 ============ */
function checkStage(){
  const bond=S.bond||0;
  const prev=S.lastStage||"初遇";
  const cur=STAGES.slice().reverse().find(s=>bond>=s.min);
  if(cur && cur.n!==prev){
    S.lastStage=cur.n;save();
    setTimeout(()=>showStageModal(prev,cur.n),500);
  }
}
function showStageModal(prev,cur){
  // 阶段对应纪念插画
  const stageImgMap={
    "初遇":"assets/stage-first-meet.png",
    "相熟":"assets/stage-acquainted.png",
    "相知":"assets/stage-knowing.png",
    "相守":"assets/stage-together.png"
  };
  const scene=stageImgMap[cur]||"assets/stage-first-meet.png";
  const overlay=document.createElement("div");
  overlay.style.cssText="position:fixed;inset:0;z-index:100;background:rgba(11,14,26,.9);display:flex;align-items:center;justify-content:center;animation:fadeIn .5s ease";
  overlay.innerHTML=`
    <div style="text-align:center;max-width:320px;padding:40px 20px;animation:pop .6s cubic-bezier(.2,1.4,.4,1)">
      <div style="font-size:12px;letter-spacing:.3em;color:var(--gold2);opacity:.7;margin-bottom:16px">关系进阶</div>
      <div style="width:240px;height:140px;margin:0 auto 20px;border-radius:8px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 32px rgba(0,0,0,.3)">
        <img src="${scene}" style="width:100%;height:100%;object-fit:cover">
      </div>
      <div style="font-size:24px;letter-spacing:.2em;margin-bottom:8px">${prev} → ${cur}</div>
      <div style="font-size:13px;opacity:.6;margin-bottom:24px;line-height:1.8">${cur==="相守"?"你们已经走过了初遇、相熟、相知。":"继续相处，亲密度会再涨。"}</div>
      <button onclick="this.closest('div[style*=fixed]').remove()" style="padding:10px 40px;border:1px solid var(--gold);color:var(--gold2);font-size:14px;letter-spacing:.2em;background:rgba(201,162,39,.1);border-radius:20px;transition:all .3s">继续</button>
    </div>`;
  overlay.onclick=()=>overlay.remove();
  document.body.appendChild(overlay);
}

/* ============ 渲染 ============ */
function render(){
  const tk=todayKey();
  const d=(S.days||{})[tk]||{draws:0};
  const left=Math.max(0,3-d.draws);
  const dc=document.getElementById("draw-counts");
  if(dc) dc.textContent="今日余 "+left+" 签";

  const ab=document.getElementById("album");
  if(ab){
    ab.innerHTML="";
    const all=Object.values(S.album||{});
    const countEl=document.getElementById("album-count");
    if(countEl) countEl.textContent=all.length;
    if(all.length===0){
      ab.innerHTML='<div style="grid-column:1/-1;text-align:center;opacity:.5;padding:40px 0;font-size:13px;letter-spacing:.1em">还没有收藏<br><br>去抽一支吧</div>';
    } else {
      all.forEach(c=>{
        const div=document.createElement("div");
        div.className="item owned";
        div.innerHTML=`<img src="${c.url}" onerror="this.style.display='none'">`;
        ab.appendChild(div);
      });
    }
  }
  renderHome();
}

/* 启动 */
document.getElementById("bg").style.backgroundImage="url('assets/bg-night-new.png')";
buildChips();
render();
</script>
